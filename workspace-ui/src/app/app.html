<mat-toolbar color="primary" class="app-header">
  <mat-icon class="header-icon">meeting_room</mat-icon>
  <span>Workspace Management</span>
</mat-toolbar>

<app-error-banner></app-error-banner>

<main class="main-container">
  <mat-tab-group (selectedIndexChange)="onTabChange($event)" animationDuration="200ms" dynamicHeight>
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">grid_view</mat-icon>
        Workspaces
      </ng-template>
        <app-resource-list></app-resource-list>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">event</mat-icon>
        Reservations
      </ng-template>
        <app-reservation-list></app-reservation-list>
    </mat-tab>
  </mat-tab-group>
</main>
