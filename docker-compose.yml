services:
  postgres:
    image: postgres:16-alpine
    container_name: workspace_db
    environment:
      POSTGRES_DB: WorkSpaceDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d WorkSpaceDb" ]
      interval: 3s
      timeout: 3s
      retries: 5
  
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workspace_api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=WorkSpaceDb;Username=postgres;Password=postgrespassword
    depends_on:
      - postgres

volumes:
  postgres_data: